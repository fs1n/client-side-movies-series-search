<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSMSS - Movie and Series Search</title>
    <meta name="description" content="Search and stream movies and TV series for free. Browse trending titles, use TMDB or IMDB as source, and pick from multiple streaming hosts.">
    <meta name="keywords" content="movies, series, streaming, free, search, TMDB, IMDB, streaming hosts, trending movies, trending series, Free movies, Free series, Watch free online, Movie database, TV database">
    <meta property="og:title" content="CSMSS - Movie and Series Search">
    <meta property="og:description" content="Search and stream movies and TV series for free. Browse trending titles with multiple streaming host options.">
    <meta property="og:type" content="website">
    <meta property="og:image" content="https://csmss.craeckor.ch/assets/image/favicon.svg">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="CSMSS - Movie and Series Search">
    <meta name="twitter:description" content="Search and stream movies and TV series for free.">
    <meta name="robots" content="index, follow">
    <link rel="icon" type="image/svg+xml" href="assets/image/favicon.svg">
    <!-- Apply theme immediately to avoid flash on load / hard-reload -->
    <script>
    (function(){
        function gc(n){var m=document.cookie.match(new RegExp('(?:^|; )'+n+'=([^;]*)'));return m?decodeURIComponent(m[1]):null;}
        var saved=gc('currentTheme');
        var dark=window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.setAttribute('data-theme',saved||(dark?'dark':'light'));
    })();
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
    <script src="assets/js/jquery.js"></script>
    <script src="assets/js/utils.js"></script>
</head>
<body>

    <!-- ── Sticky header ───────────────────────────── -->
    <header>
        <div id="headerInner">
            <div id="headerBrand" role="button" tabindex="0" aria-label="Clear search and go to trending">
                <i class="fa-solid fa-film" aria-hidden="true"></i>
                <span>CSMSS</span>
            </div>
            <div id="headerControls">
                <button id="switchEngineButton" data-engine="TMDB" onclick="switchEngine()">Switch to TMDB</button>
                <input type="text" id="searchInput" placeholder="Search movies &amp; series…" autocomplete="off" spellcheck="false">
                <button id="themeToggle" title="Toggle theme" aria-label="Toggle dark/light theme"><i class="fa-regular fa-moon"></i></button>
            </div>
        </div>
    </header>

    <!-- ── Page body ───────────────────────────────── -->
    <div id="mainContainer">
        <main>

            <!-- Player -->
            <div id="iframeContainer">
                <iframe id="movieIframe" allowfullscreen tabindex="0"></iframe>
                <button id="playerCloseOverlay" onclick="closeIframe()" title="Close (Esc)" aria-label="Close player">✕</button>
                <div id="buttonContainer">
                    <div id="leftControls">
                        <select id="hostSelect" onchange="changeHost()">
                            <option value="vidsrc-pro">VidSrc.pro</option>
                            <option value="autoembed">AutoEmbed</option>
                            <option value="superembed">SuperEmbed</option>
                            <option value="2embed">2Embed</option>
                            <option value="vidsrc-me">VidSrc.me</option>
                            <option value="vidsrc-cc">VidSrc.cc</option>
                            <option value="smashystream">SmashyStream</option>
                            <option value="moviesapi">MoviesAPI</option>
                            <option value="primewire">PrimeWire</option>
                            <option value="filmku">FILMku</option>
                            <option value="vidsrc-nl">VidSrc.nl</option>
                        </select>
                        <div id="infoText"></div>
                    </div>
                    <div id="rightControls">
                        <div class="stepControl" id="seasonControl" style="display:none">
                            <span class="stepLabel">Season</span>
                            <button class="stepBtn" onclick="changeSeason(-1)">−</button>
                            <input class="stepValue" id="seasonValue" type="text" value="1" readonly>
                            <button class="stepBtn" onclick="changeSeason(1)">+</button>
                        </div>
                        <div class="stepControl" id="episodeControl" style="display:none">
                            <span class="stepLabel">Ep</span>
                            <button class="stepBtn" onclick="changeEpisode(-1)">−</button>
                            <input class="stepValue" id="episodeValue" type="text" value="1" readonly>
                            <button class="stepBtn" onclick="changeEpisode(1)">+</button>
                        </div>
                        <button id="episodeGuideBtn" title="Episode Guide" style="display:none">Episodes</button>
                        <button id="fullscreenButton" onclick="toggleFullscreen()">Fullscreen</button>
                        <button id="closeButton" onclick="closeIframe()">Close</button>
                    </div>
                </div>
            </div>

            <!-- Recently watched + results -->
            <div id="recentSection"></div>
            <p id="sectionLabel"></p>
            <div id="output"></div>
        </main>

        <footer>
            <a href="https://github.com/craeckor/client-side-movies-series-search/tree/beta" target="_blank" rel="noopener noreferrer" title="View on GitHub">
                <img src="assets/image/github-mark-white.svg" alt="GitHub" width="22" height="22">
            </a>
            <p>Issues? Try the official version at <a href="https://csmss.craeckor.ch/" target="_blank" rel="noopener noreferrer">csmss.craeckor.ch</a></p>
        </footer>
    </div>

    <!-- ── Episode guide overlay (fixed, portal-like) ── -->
    <div id="episodeGuideOverlay">
        <div id="episodeGuideModal">
            <button id="episodeGuideClose">×</button>
            <h2 id="episodeGuideTitle"></h2>
            <div id="episodeGuideSeasonNav"></div>
            <p id="episodeGuideSeasonOverview"></p>
            <p id="episodeGuideInfo"></p>
            <div id="episodeGrid"></div>
        </div>
    </div>

    <div id="focusToast"></div>

    <script src="assets/js/imdb.js"></script>
    <script src="assets/js/tmdb.js"></script>
    <script src="assets/js/switcher.js"></script>
    <script>
        $(document).ready(function () {

            // ── Theme ──────────────────────────────────────────────
            var saved = getCookie('currentTheme');
            var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            var theme = saved || (prefersDark ? 'dark' : 'light');
            $('html').attr('data-theme', theme);
            $('#themeToggle').html(theme === 'dark' ? '<i class="fa-solid fa-sun"></i>' : '<i class="fa-regular fa-moon"></i>');

            $('#themeToggle').on('click', function () {
                var current = $('html').attr('data-theme');
                var next = current === 'dark' ? 'light' : 'dark';
                $('html').attr('data-theme', next);
                setCookie('currentTheme', next, 30);
                $(this).html(next === 'dark' ? '<i class="fa-solid fa-sun"></i>' : '<i class="fa-regular fa-moon"></i>');
            });

            // ── Section label + empty state ─────────────────────────
            var isTmdb = getCookie('currentEngine') === 'tmdb';
            if (isTmdb) {
                $('#sectionLabel').text('Trending this week');
            } else {
                var msg = document.createElement('p');
                msg.className = 'empty-state';
                msg.textContent = 'Search for a movie or series to get started.';
                document.getElementById('output').appendChild(msg);
            }

            renderRecent();

            // ── Set abbreviated engine label for mobile button ─────
            var engNow = getCookie('currentEngine') || 'imdb';
            $('#switchEngineButton').attr('data-engine', engNow === 'imdb' ? 'TMDB' : 'IMDB');

            // ── Search: autofocus + clear button ───────────────────
            $('#searchInput').wrap('<div id="searchWrapper"></div>');
            $('#searchWrapper').append('<button id="clearSearch" title="Clear">×</button>');
            $('#clearSearch').hide();

            $('#searchInput').focus();

            $('#searchInput').on('input', function () {
                var hasVal = $(this).val().length > 0;
                $('#clearSearch').toggle(hasVal);
                if (isTmdb) {
                    $('#sectionLabel').text(!hasVal ? 'Trending this week' : '');
                } else if (hasVal) {
                    $('#output .empty-state').remove();
                }
            });

            $('#clearSearch').on('click', function () {
                sessionStorage.removeItem('csmss_search');
                if (typeof window.cancelTmdbDebounce === 'function') window.cancelTmdbDebounce();
                $('#searchInput').val('').focus();
                $('#clearSearch').hide();
                if (isTmdb) {
                    $('#sectionLabel').text('Trending this week');
                    loadTrending();
                } else {
                    $('#sectionLabel').text('');
                    $('#output').empty();
                }
            });

            $('#headerBrand').on('click', function () {
                sessionStorage.removeItem('csmss_search');
                if (typeof window.cancelTmdbDebounce === 'function') window.cancelTmdbDebounce();
                $('#searchInput').val('');
                $('#clearSearch').hide();
                if (isTmdb) {
                    $('#sectionLabel').text('Trending this week');
                    loadTrending();
                } else {
                    $('#sectionLabel').text('');
                    $('#output').empty();
                }
            }).on('keydown', function (e) {
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    $(this).trigger('click');
                }
            });

            // ── Card active state ──────────────────────────────────
            $(document).on('click', '.preview', function () {
                $('.preview').removeClass('active');
                $(this).addClass('active');
            });

            // ── Keyboard shortcuts ─────────────────────────────────
            $(document).on('keydown', function (e) {
                if (e.key === 'Escape') {
                    if ($('#episodeGuideOverlay').hasClass('open')) {
                        closeEpisodeGuide();
                    } else if ($('#iframeContainer').css('display') !== 'none') {
                        closeIframe();
                    }
                }
                if (e.key === 'Enter' && $(document.activeElement).is('#searchInput')) {
                    $('.preview').first().trigger('click');
                }
                if (e.key === 'p' && $('#iframeContainer').css('display') !== 'none') {
                    document.getElementById('movieIframe').focus();
                    showFocusToast('Player focused — F: fullscreen, Esc: close page controls');
                }
            });

            // ── Scroll to player on open ───────────────────────────
            new MutationObserver(function (mutations) {
                mutations.forEach(function (m) {
                    if (m.target.style.display === 'block') {
                        $('html, body').animate(
                            { scrollTop: $('#iframeContainer').offset().top - 72 },
                            280
                        );
                        setTimeout(function () { document.getElementById('movieIframe').focus(); }, 300);
                        setTimeout(function () {
                            var isT = getCookie('currentEngine') === 'tmdb';
                            var st = isT && window.getTmdbSeriesState ? window.getTmdbSeriesState()
                                   : !isT && window.getImdbSeriesState ? window.getImdbSeriesState()
                                   : null;
                            $('#episodeGuideBtn').toggle(!!(st && st.isSeries));
                        }, 0);
                    } else {
                        $('#episodeGuideBtn').hide();
                    }
                });
            }).observe(document.getElementById('iframeContainer'), {
                attributes: true,
                attributeFilter: ['style']
            });

            // ── Loading state ──────────────────────────────────────
            new MutationObserver(function (mutations) {
                mutations.forEach(function (m) {
                    if (m.type === 'childList') {
                        if (m.target.children.length === 0 && $('#searchInput').val().trim() !== '') {
                            $('#output').addClass('loading');
                        } else {
                            $('#output').removeClass('loading');
                        }
                    }
                });
            }).observe(document.getElementById('output'), { childList: true });

            // ── Re-focus iframe on player area click ──────────────────
            $(document).on('click', '#iframeContainer', function (e) {
                if ($(e.target).closest('#playerCloseOverlay, #buttonContainer').length) return;
                document.getElementById('movieIframe').focus();
            });

            // ── Fullscreen label sync ──────────────────────────────
            $(document).on('fullscreenchange webkitfullscreenchange mozfullscreenchange', function () {
                $('#fullscreenButton').text(document.fullscreenElement ? 'Exit Fullscreen' : 'Fullscreen');
            });

            // ── Scroll back to results on close ────────────────────
            $(document).on('click', '#closeButton', function () {
                setTimeout(function () {
                    $('html, body').animate(
                        { scrollTop: $('#output').offset().top - 72 },
                        280
                    );
                }, 50);
            });

            // ── Episode guide overlay ──────────────────────────────
            $(document).on('click', '#episodeGuideClose, #episodeGuideOverlay', function (e) {
                if (e.target === this) closeEpisodeGuide();
            });

            // ── Infinite scroll / load more ───────────────────────
            var scrollTimer;
            $(window).on('scroll', function () {
                clearTimeout(scrollTimer);
                scrollTimer = setTimeout(checkScrollLoadMore, 200);
            });

            // ── Season/episode stepper direct-edit ────────────────
            $(document).on('click', '.stepValue', function () {
                $(this).prop('readonly', false).select();
            });

            $(document).on('keydown', '.stepValue', function (e) {
                if (e.key === 'Enter') { e.preventDefault(); $(this).blur(); }
                if (e.key === 'Escape') { $(this).prop('readonly', true); updateStepControlsFromState(); }
            });

            $(document).on('blur', '.stepValue', function () {
                var val = parseInt($(this).val(), 10);
                $(this).prop('readonly', true);
                if (isNaN(val) || val < 1) { updateStepControlsFromState(); return; }
                if (this.id === 'seasonValue' && typeof window.setSeasonDirect === 'function') {
                    window.setSeasonDirect(val);
                } else if (this.id === 'episodeValue' && typeof window.setEpisodeDirect === 'function') {
                    window.setEpisodeDirect(val);
                }
            });

            // ── Episode guide button ───────────────────────────────
            $('#episodeGuideBtn').on('click', function () {
                var isTmdb = getCookie('currentEngine') === 'tmdb';
                var state;
                if (isTmdb && typeof window.getTmdbSeriesState === 'function') {
                    state = window.getTmdbSeriesState();
                } else if (!isTmdb && typeof window.getImdbSeriesState === 'function') {
                    state = window.getImdbSeriesState();
                }
                if (!state || !state.isSeries) return;
                openEpisodeGuide(state.currentTmdbId || state.currentImdbId, state.currentTitle, state.currentSeason);
            });

        });

        // ── Global helpers ─────────────────────────────────────────

        function updateStepControlsFromState() {
            var sv = document.getElementById('seasonValue');
            var ev = document.getElementById('episodeValue');
            var isT = getCookie('currentEngine') === 'tmdb';
            var st = isT && window.getTmdbSeriesState ? window.getTmdbSeriesState()
                   : !isT && window.getImdbSeriesState ? window.getImdbSeriesState() : null;
            if (st && sv) sv.value = st.currentSeason;
            if (st && ev) ev.value = st.currentEpisode;
        }

        var focusToastTimer = null;
        function showFocusToast(msg) {
            var t = document.getElementById('focusToast');
            t.textContent = msg || 'Player focused — F: fullscreen, Esc: close page controls';
            t.classList.add('visible');
            clearTimeout(focusToastTimer);
            focusToastTimer = setTimeout(function () { t.classList.remove('visible'); }, 2200);
        }

        function closeEpisodeGuide() {
            $('#episodeGuideOverlay').removeClass('open');
            document.body.style.overflow = '';
        }

        function checkScrollLoadMore() {
            if (typeof window.loadMoreResults !== 'function') return;
            if (getCookie('currentEngine') !== 'tmdb') return;
            if (document.getElementById('searchInput').value.trim() === '') return;
            if (typeof window.hasActiveSearch === 'function' && !window.hasActiveSearch()) return;
            if ($(window).scrollTop() === 0) return;
            var nearBottom = $(document).height() - $(window).height() - $(window).scrollTop() < 300;
            if (nearBottom) window.loadMoreResults();
        }

        // ── Session restore ────────────────────────────────
        (function () {
            var engine = getCookie('currentEngine') || 'imdb';
            var savedSearch = sessionStorage.getItem('csmss_search');
            if (savedSearch) {
                $('#searchInput').val(savedSearch);
                if (typeof window.fetchTmdbData === 'function') {
                    window.fetchTmdbData(1);
                } else {
                    $('#searchInput').trigger('input');
                }
            }
            var savedPlayer = sessionStorage.getItem('csmss_player');
            if (savedPlayer) {
                try {
                    var p = JSON.parse(savedPlayer);
                    if (p.engine === engine) {
                        setTimeout(function () {
                            if (p.engine === 'tmdb' && typeof window.openTmdbIframe === 'function') {
                                window.openTmdbIframe(p.mediaId, p.mediaType, p.title);
                                if (p.isSeries && typeof window.setTmdbSeasonEpisode === 'function')
                                    window.setTmdbSeasonEpisode(p.season, p.episode);
                            } else if (p.engine === 'imdb' && typeof window.openImdbIframe === 'function') {
                                window.openImdbIframe(p.mediaId, p.qid, p.title);
                                if (p.isSeries && typeof window.setImdbSeasonEpisode === 'function')
                                    window.setImdbSeasonEpisode(p.season, p.episode);
                            }
                        }, 100);
                    }
                } catch (e) {}
            }
        })();

    </script>
</body>
</html>
